<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="看见之外，另有回响。一段尚未完全显形的序章。">
  <title>看见之外 · 序章</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='black'/%3E%3Cpath d='M15 32h34' stroke='white' stroke-width='2'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <a class="skip" href="#story">进入序章</a>

  <main>
    <section class="hero" id="opening" aria-labelledby="opening-title">
      <div class="hero-art"><img src="assets/01-opening.png" width="1024" height="1536" alt="黑暗中，圆润的人像以手遮眉，望向前方" fetchpriority="high"></div>
      <div class="hero-shade" aria-hidden="true"></div>
      <div class="hero-copy">
        <h1 id="opening-title" class="intro">看见之外<span class="period">。</span></h1>
      </div>

    </section>

    <section class="afterglow" aria-labelledby="afterglow-title">
      <div class="afterglow-art reveal"><img src="assets/12-afterglow.png" alt="极暗之中，一道光掠过柔和的边缘" width="1024" height="1536" loading="lazy"></div>
      <div class="afterglow-copy reveal">
        <h2 id="afterglow-title">不露声色，<br>已然不同。</h2>
      </div>
    </section>

    <div id="story" class="anchor"></div>
    <section class="scene scene-focus" aria-labelledby="thread-title">
      <div class="section-copy reveal"><h2 id="thread-title">一念澄明。</h2></div>
      <div class="scene-art reveal"><img src="assets/02-thread.png" width="1792" height="1024" alt="暗色人像两侧的细光，缓缓收束成一线" loading="lazy"></div>
    </section>

    <section class="paired" aria-label="一念与片刻">
      <article class="paired-scene reveal">
        <div class="paired-art"><img src="assets/03-whisper-v2.png" width="1792" height="1024" alt="圆润人像的眼际，一圈极淡的纹路向远处散开" loading="lazy"></div>
        <div class="paired-copy"><h2>一瞬之间。</h2></div>
      </article>
      <article class="paired-scene reveal">
        <div class="paired-art"><img src="assets/04-rest.png" width="1792" height="1024" alt="一枚圆润暗石，安稳落在柔和的弧面中" loading="lazy"></div>
        <div class="paired-copy"><h2>片刻，有所安放。</h2></div>
      </article>
    </section>

    <section class="scene scene-moments" aria-labelledby="moments-title">
      <div class="section-copy reveal"><h2 id="moments-title">一瞬触动，<br>悄然留存。</h2></div>
      <div class="scene-art reveal"><img src="assets/05-moments.png" width="1792" height="1024" alt="比心、远望、冲线与挥别的抽象片段，向右侧的黑暗延伸" loading="lazy"></div>
    </section>

    <section class="scene scene-echo" aria-labelledby="echo-title">
      <div class="scene-art reveal"><img src="assets/06-echo.png" width="1792" height="1024" alt="微光穿过高低不同的暗色圆润体块" loading="lazy"></div>
      <div class="section-copy reveal"><h2 id="echo-title">起伏，都有回声。</h2></div>
    </section>

    <section class="scene scene-traces" aria-labelledby="traces-title">
      <div class="section-copy reveal"><h2 id="traces-title">那些小事，<br>还在原处。</h2></div>
      <div class="scene-art reveal"><img src="assets/07-traces.png" width="1792" height="1024" alt="几幅日常暗色片段，杯子后的一串钥匙被轻轻照亮" loading="lazy"></div>
    </section>

    <section class="scene scene-path" aria-labelledby="path-title">
      <div class="scene-art reveal"><img src="assets/08-path.png" width="1792" height="1024" alt="一个抽象人影沿着柔和光路向前，转角隐入黑暗" loading="lazy"></div>
      <div class="section-copy reveal"><h2 id="path-title">路，自会展开。</h2></div>
    </section>

    <section class="details" id="details" aria-label="细节">
      <div class="details-grid">
        <figure class="detail detail-touch reveal"><div class="detail-art"><img src="assets/09-touch.png" alt="黑灰色曲面上，一小片细腻织物触面" width="1024" height="1536" loading="lazy"></div><figcaption><h3>贴近，无声。</h3></figcaption></figure>
        <figure class="detail detail-glint reveal"><div class="detail-art"><img src="assets/10-glint.png" alt="黑色玻璃深处，一束光停在极小的圆心" width="1024" height="1536" loading="lazy"></div><figcaption><h3>藏一束光。</h3></figcaption></figure>
        <figure class="detail detail-curve reveal"><div class="detail-art"><img src="assets/11-curve.png" alt="被阴影遮住一半的圆润小曲面，覆着细密织纹" width="1024" height="1536" loading="lazy"></div><figcaption><h3>贴近，拾取信号。</h3></figcaption></figure>
      </div>
    </section>

    <section class="closing" id="coming" aria-labelledby="closing-title">
      <div class="closing-copy reveal"><h2 id="closing-title">将近<span>。</span></h2></div>
      <div class="closing-art reveal"><img src="assets/13-horizon-v2.png" width="1024" height="1536" alt="一道极薄的光，横在尚未显形的轮廓之上" loading="lazy"></div>
    </section>
  </main>
</body>
</html>
