<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#000000">
  <meta name="robots" content="noindex,nofollow">
  <title>看见之外</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16'/%3E%3Cpath d='M10 32Q32 9 54 32Q32 55 10 32Z' fill='none' stroke='%23888'/%3E%3Ccircle cx='32' cy='32' r='7' fill='none' stroke='%23ccc'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/_entry/entry.css?v=flow1">
  <link rel="stylesheet" href="/_entry/language.css?v=20261104-1">
  <script src="/_entry/language.js?v=20261104-2" defer></script>
  <script src="/_entry/eye-cloud.js?v=flow4" defer></script>
  <script src="/_entry/entry.js?v=flow5" defer></script>
</head>
<body>
  <main class="entry" id="entry" aria-label="口令入口">
    <button class="language-switch" type="button" data-language-switch aria-label="Switch to English"><span class="language-zh" aria-hidden="true">中</span><span class="language-star" aria-hidden="true"></span><span class="language-en" aria-hidden="true">EN</span></button>
    <div class="eye-position">
      <div class="eye-zoom" id="eye-zoom" data-pupil-x="0.5" data-pupil-y="0.53" data-pupil-width="0.125">
        <div class="eye-drift" id="eye-drift">
          <div class="eye" role="img" aria-label="黑暗中，柔和光线勾勒出一只黑色雕塑眼睛">
            <img class="eye-main" src="/_entry/eye-sculpture-v2.png" alt="" width="1536" height="1024" fetchpriority="high">
            <img class="eye-red" src="/_entry/eye-sculpture-v2.png" alt="" width="1536" height="1024" aria-hidden="true">
          </div>
        </div>
      </div>
    </div>
    <form class="passphrase" id="passphrase-form" autocomplete="off">
      <label class="visually-hidden" for="passphrase">输入密令后按回车</label>
      <input id="passphrase" name="passphrase" type="text" inputmode="text" lang="zh-CN" autocomplete="off" maxlength="128" enterkeyhint="go" spellcheck="false" autocapitalize="none" aria-describedby="entry-status" required>
      <span class="input-line" aria-hidden="true"></span>
      <button type="submit" class="visually-hidden">进入</button>
    </form>
    <p id="entry-status" class="visually-hidden" role="status" aria-live="polite"></p>
  </main>
</body>
</html>
